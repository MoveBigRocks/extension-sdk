name: Validate SDK Template

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SDK sources
        uses: actions/checkout@v4

      - name: Install pinned public CLI for contract validation
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/mbr_v1.0.14_linux_amd64.tar.gz"
          curl --fail --location --retry 3 --output "$archive" \
            https://github.com/MoveBigRocks/releases/releases/download/v1.0.14/mbr_v1.0.14_linux_amd64.tar.gz
          echo "613f428c24844a634d2b696cb3f585387d21a22e611a40be3813bab053a12a63  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" mbr
          "$RUNNER_TEMP/mbr" version --json | jq -e '.version == "v1.0.14"'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run SDK tests with race detection
        run: GOWORK=off go test -race ./...

      - name: Validate template manifest and contract
        run: |
          "${RUNNER_TEMP}/mbr" extensions lint . --json
          "${RUNNER_TEMP}/mbr" extensions lint . --write-contract --json
          git diff --exit-code -- extension.contract.json

      - name: Build sample bundle
        run: |
          go run ./scripts/build-bundle --source . --out "${RUNNER_TEMP}/sample-extension.bundle.json"
          test -s "${RUNNER_TEMP}/sample-extension.bundle.json"

      - name: Smoke test signing tools
        run: |
          go run ./scripts/generate-signing-key \
            --publisher "Move Big Rocks CI" \
            --key-id ci-test \
            --seed-out "${RUNNER_TEMP}/extension-sdk.seed.b64" \
            --trusted-publishers-out "${RUNNER_TEMP}/extension-sdk.publisher.json"
          export MBR_EXTENSION_SIGNING_PRIVATE_KEY_B64="$(cat "${RUNNER_TEMP}/extension-sdk.seed.b64")"
          go run ./scripts/sign-bundle \
            --bundle "${RUNNER_TEMP}/sample-extension.bundle.json" \
            --out "${RUNNER_TEMP}/sample-extension.signed.bundle.json" \
            --key-id ci-test \
            --private-key-env MBR_EXTENSION_SIGNING_PRIVATE_KEY_B64 \
            --publisher-key-out "${RUNNER_TEMP}/extension-sdk.publisher-key.json"
          test -s "${RUNNER_TEMP}/sample-extension.signed.bundle.json"
          test -s "${RUNNER_TEMP}/extension-sdk.publisher.json"
          test -s "${RUNNER_TEMP}/extension-sdk.publisher-key.json"

      - name: Verify the freshly signed bundle
        run: |
          go run ./scripts/verify-signed-bundle \
            --bundle "${RUNNER_TEMP}/sample-extension.signed.bundle.json" \
            --instance-id ci-instance \
            --trusted-publishers "${RUNNER_TEMP}/extension-sdk.publisher-key.json"
